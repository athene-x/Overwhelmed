  keycloak:
    # Production mode: durable storage in the postgres 'keycloak' database
    # (created by infrastructure/postgres/init on first start). TLS is
    # terminated at the proxy; set KEYCLOAK_HOSTNAME in .env.
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

